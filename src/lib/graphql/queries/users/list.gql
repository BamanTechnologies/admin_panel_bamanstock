query getUsers(
  $filter: account_users_bool_exp
  $limit: Int
  $offset: Int
  $order: [account_users_order_by]
) {
  account_users(
    where: $filter
    offset: $offset
    limit: $limit
    order_by: $order
  ) {
    id
    first_name
    last_name
    phone
    email
    profile_picture
    telegram_chat_id
    telegram_user_name
    is_active
    created_at
    connect_telegram_url
    updated_at
    roles: user_roles {
      role
    }
  }
  total: account_users_aggregate(where: $filter) {
    aggregate {
      count
    }
  }
}
